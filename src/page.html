<title>Scrap Tankers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 配置: 全画面のキャンバスの上に、端へ寄せた HUD と中央のカードを重ねる */
:root{color-scheme:dark;--bg:#17324a;--ink:#f4f7ff;--dim:#a9b6d6;--panel:#131d36;--line:#2e4170;--gold:#ffc83a;--gold2:#c98a00;--hp:#5fe08a;--xp:#49b8ff;--bad:#ff5b6b;--warn:#ffd23f;--dark:#0b1224;
--font:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Yu Gothic UI",Meiryo,system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:800;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 30px var(--bad)}
#vig.show{animation:vig .45s ease-out}
@keyframes vig{0%{opacity:.85}100%{opacity:0}}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 2px 0 rgba(11,18,36,.55)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.hpw{display:flex;flex-direction:column;gap:3px;max-width:240px;min-width:0}
.bar{height:16px;border-radius:9px;background:var(--dark);border:2px solid var(--dark);overflow:hidden;box-shadow:0 2px 0 rgba(11,18,36,.4)}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .12s linear}
.bar.hp i{background:var(--hp)}.bar.hp.warn i{background:var(--warn)}.bar.hp.crit i{background:var(--bad)}.bar.hp.crit{animation:crit .5s ease-in-out infinite alternate}
@keyframes crit{to{border-color:var(--bad);box-shadow:0 0 12px var(--bad)}}
.bar.xp i{background:var(--xp);width:0}.bar.boss i{background:var(--bad)}
.num{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.mid{text-align:center;line-height:1.15}
#wave{font-size:clamp(16px,2.6vw,22px);letter-spacing:.04em}
#time{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.scrap{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-size:16px;font-variant-numeric:tabular-nums;text-shadow:none}
.nut{display:inline-block;width:14px;height:14px;background:var(--gold);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);vertical-align:-2px}
.ib{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.ib.off{color:var(--dim);text-decoration:line-through}
.ib:focus-visible,.card:focus-visible,.gbtn:focus-visible,.big:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
#bossw{align-self:center;width:min(520px,100%);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bad)}
#bossw .bar{flex:1}
#banner{align-self:center;margin-top:6vh;font-size:clamp(26px,6vw,46px);letter-spacing:.06em;opacity:0;color:var(--ink);-webkit-text-stroke:1px var(--dark);text-shadow:0 4px 0 var(--dark)}
#banner.big{color:var(--gold)}
#banner.show{animation:ban 1.9s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.grow{flex:1}
#hint{align-self:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-size:16px;text-align:center;text-shadow:none;max-width:100%}
kbd{display:inline-block;min-width:22px;padding:1px 5px;margin-right:3px;border-radius:6px;background:var(--ink);color:var(--dark);font:inherit;font-size:12px;text-align:center;box-shadow:0 2px 0 var(--dim)}
#keys{align-self:flex-start;display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-size:12px;color:var(--dim);text-shadow:none;opacity:.92}
#keys span{white-space:nowrap}#keys b{color:var(--ink)}
#hint.pulse{border-color:var(--gold);animation:hintp 1s ease-in-out infinite alternate}
@keyframes hintp{to{box-shadow:0 0 16px var(--gold2)}}
.xpw{display:flex;align-items:center;gap:8px}
.xpw .bar{flex:1;height:12px}
.lv{font-size:14px;min-width:44px}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(244,247,255,.5);background:rgba(11,18,36,.25);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(244,247,255,.8);transform:translate(-50%,-50%)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,18,36,.62);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.ovt{font-size:clamp(24px,5vw,38px);color:var(--gold);text-shadow:0 3px 0 var(--dark);letter-spacing:.04em;text-align:center}
.ovs{font-size:14px;color:var(--ink)}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:760px}
.card{position:relative;flex:1 1 200px;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px 14px;border-radius:18px;border:3px solid var(--c);border-bottom-width:7px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;text-align:center;animation:pop .28s ease-out both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
@keyframes pop{0%{transform:translateY(18px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.card:hover{transform:translateY(-3px)}
.card .ico{width:58px;height:58px;border-radius:16px;background:var(--c);color:var(--dark);display:grid;place-items:center}
.card .ico svg{width:34px;height:34px}
.card .ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.card b{font-size:18px}.card small{font-size:13px;color:var(--dim);font-weight:700}
.card .clv{font-size:12px;color:var(--c)}
.card .key{position:absolute;top:8px;left:10px;font-size:12px;color:var(--dim)}
.panel{width:min(460px,100%);background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.rtitle{font-size:clamp(24px,6vw,34px);letter-spacing:.03em}.rtitle.win{color:var(--gold)}.rtitle.lose{color:var(--bad)}
#rsub{font-size:13px;color:var(--dim)}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#stats div{background:var(--dark);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column}
#stats small{font-size:11px;color:var(--dim)}#stats b{font-size:20px;font-variant-numeric:tabular-nums}
#earn{font-size:17px;color:var(--gold)}
#gart{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
#gar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{display:flex;flex-direction:column;gap:2px;align-items:center;padding:8px 4px;border-radius:14px;border:2px solid var(--line);border-bottom-width:5px;background:var(--dark);color:var(--dim);font:inherit;min-width:0}
.gbtn b{font-size:14px;color:var(--ink)}.gbtn i{font-style:normal;color:var(--xp);font-size:12px}
.gbtn small{font-size:11px}.gbtn .cost{font-size:14px;font-variant-numeric:tabular-nums}
.gbtn.can{border-color:var(--gold);color:var(--gold);cursor:pointer;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px var(--gold2)}}
#goal{font-size:12px;color:var(--dim);min-height:1em}
#toast{align-self:center;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:6px 14px;font-size:14px;color:var(--gold);opacity:0;text-shadow:none;text-align:center}
#toast.show{animation:ban 3.2s ease-out}
#supply{font-size:13px;background:var(--dark);border:2px dashed var(--line);border-radius:12px;padding:7px 10px}#supply b{color:var(--gold)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tb{position:relative;font:inherit;font-size:13px;padding:7px 4px;border-radius:10px;border:2px solid var(--line);background:var(--dark);color:var(--dim);cursor:pointer}
.tb.on{color:var(--ink);border-color:var(--xp)}.tb .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.plab{font-size:11px;color:var(--dim);text-align:left;margin:2px 0}
.prow{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;margin-bottom:4px}
.gbtn.own{cursor:pointer;color:var(--ink)}.gbtn.on{border-color:var(--hp);color:var(--hp)}
.dm{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;background:var(--dark);border-radius:10px;padding:6px 10px;font-size:13px;text-align:left;margin-bottom:6px}
.dm .bar{grid-column:1/3;height:8px;border-width:1px}.dm .bar i{background:var(--xp)}.dm.done{color:var(--hp)}.dm.done .bar i{background:var(--hp)}
.big{font:inherit;font-size:20px;color:var(--dark);background:var(--gold);border:0;border-bottom:6px solid var(--gold2);border-radius:16px;padding:13px 10px;cursor:pointer}
.big:active{transform:translateY(3px);border-bottom-width:3px}
#diag{position:absolute;left:8px;bottom:8px;max-width:90%;margin:0;padding:6px 8px;background:var(--dark);color:var(--bad);font:12px/1.3 ui-monospace,monospace;white-space:pre-wrap;z-index:9}
@media (max-width:560px){.card{flex:1 1 100%;max-width:none;flex-direction:row;text-align:left;padding:12px 12px 12px 14px;gap:12px}.card .ct{flex:1}.card .key{display:none}.card .ico{width:50px;height:50px;flex:none}}
@media (max-height:430px){.card{padding:10px}.card .ico{width:44px;height:44px}.panel{padding:10px 14px;gap:6px}#stats b{font-size:16px}.big{padding:9px}}
@media (prefers-reduced-motion:reduce){.card,.gbtn.can,#banner.show{animation-duration:.01s}}
</style>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="hud">
    <div class="top">
      <div class="hpw"><div class="bar hp" id="hpbar"><i id="hpb"></i></div><div class="num" id="hpn"></div></div>
      <div class="mid"><div id="wave"></div><div id="time"></div></div>
      <div class="right"><div class="scrap"><span class="nut"></span><span id="scr">0</span></div><button id="mute" class="ib" aria-label="Sound">♪</button></div>
    </div>
    <div id="bossw" hidden><span>BOSS</span><div class="bar boss"><i id="bossb"></i></div></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div class="grow"></div>
    <div id="hint" hidden></div>
    <div id="keys" hidden></div>
    <div class="xpw"><div class="lv" id="lv">Lv 1</div><div class="bar xp"><i id="xpb"></i></div></div>
  </div>
  <div id="joy" hidden><i></i></div>
  <div id="lvl" class="ov" hidden><div class="ovt" id="lvlt"></div><div class="ovs" id="lvls"></div><div id="cards"></div></div>
  <div id="res" class="ov" hidden>
    <div class="panel">
      <div class="rtitle" id="rtitle"></div><div id="rsub"></div><div id="stats"></div><div id="earn"></div>
      <div id="supply" hidden></div><div id="tabs"></div>
      <div id="tab_up"><div id="gar"></div></div><div id="tab_parts" hidden></div><div id="tab_daily" hidden></div>
      <div id="total" style="font-size:14px"></div><div id="goal"></div>
      <button id="go" class="big"></button>
    </div>
  </div>
  <pre id="diag" hidden></pre>
</div>
<!--JS-->
